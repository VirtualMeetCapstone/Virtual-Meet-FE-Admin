<section class="content" style="background-color: #eee;">
    <div class="container py-5">
      <div class="row">
        <div class="col">
          <nav aria-label="breadcrumb" class="bg-body-tertiary rounded-3 p-3 mb-4">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a routerLink="/room-manager" routerLinkActive="active" >Room Management</a></li>

              <li class="breadcrumb-item active" aria-current="page">Room Detail</li>
            </ol>
          </nav>
        </div>
      </div>

      <div class="row">
        <div class="col-lg-4">
          <div class="card mb-4">
            <div class="card-body text-center">
              <img [src]="user?.picture?.url" alt="avatar"
              class="rounded-circle img-fluid" style="width: 150px; height: 150px;">

              <h5 class="my-3">{{user?.name}}</h5>

              <div class="d-flex justify-content-center mb-2">
                <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary">Follow</button>
                <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-outline-primary ms-1">Message</button>
              </div>
            </div>
          </div>

        </div>
        <div class="col-lg-8">
          <div class="card mb-4">
            <div class="card-body">
              <div class="row">
                <div class="col-sm-3">
                  <p class="mb-0">Hosted By</p>
                </div>
                <div class="col-sm-9">
                  <p class="text-muted mb-0">{{user?.name}}</p>
                </div>
              </div>
              <hr>
              <div class="row">
                <div class="col-sm-3">
                  <p class="mb-0">Topic</p>
                </div>
                <div class="col-sm-9">
                  <p class="text-muted mb-0">{{room?.topic}}</p>


                </div>
              </div>

              <hr>
              <div class="row">
                <div class="col-sm-3">
                  <p class="mb-0">Description</p>
                </div>
                <div class="col-sm-9">
                  <p class="text-muted mb-0">{{room?.description}}</p>


                </div>
              </div>
              <hr>
              <div class="row">
                <div class="col-sm-3">
                  <p class="mb-0">Created At</p>
                </div>
                <div class="col-sm-9">
                  <p class="text-muted mb-0">Jun 15, 2017</p>
                </div>
              </div>
              <hr>
              <div class="row">
                <div class="col-sm-3">
                  <p class="mb-0">Status</p>
                </div>
                <div class="col-sm-9">
                  <p class="text-muted mb-0">Active</p>
                </div>
              </div>
              <hr>
              <div class="row">
                <div class="col-sm-3">
                  <p class="mb-0">Media</p>
                </div>
                <div class="col-sm-9">
                  <p class="text-muted mb-0">Room Media</p>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </section>
