<div class="email-config-container">
  <h2>Email Notification</h2>
  <form (submit)="sendNotification()">
    <div class="form-group">
      <label for="subject">Subject:</label>
      <input id="subject" type="text" [(ngModel)]="emailSubject" name="subject" required />
    </div>

    <div class="form-group">
      <label for="message">Message:</label>
      <textarea id="message" class="message" rows="5" [(ngModel)]="emailMessage" name="message" required></textarea>
    </div>

    <div class="form-group">
      <label for="file">Attach File:</label>
      <input id="file" type="file" (change)="onFileSelected($event)" />
      <p *ngIf="selectedFile">Selected: {{ selectedFile.name }}</p>
    </div>

    <button type="submit" class="send-btn">Send Notification</button>
  </form>

  <p *ngIf="successMessage" class="success">{{ successMessage }}</p>
</div>
