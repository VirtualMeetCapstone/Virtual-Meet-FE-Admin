<div class="report-container">
  <h1>📌 Revenue Report</h1>
  <div class="filter">
    <p><strong>From Date:</strong>&nbsp;<input type="date" [(ngModel)]="beforeDate" name="from-date"> </p>
    <p><strong>To Date:</strong> &nbsp;<input type="date" [(ngModel)]="afterDate"  name="to-date"> </p>
  </div>

  <table id="revenue-report">
    <tr><th>Category</th><th>Value</th></tr>
    <tr><td>Total Revenue (USD)</td><td>3,500</td></tr>
    <tr><td>Total Revenue in range {{beforeDate}} - {{afterDate}} (USD)</td><td>480</td></tr>
    <tr><td>Revenue from Upgrade Account</td><td>450</td></tr>
    <tr><td>Revenue from Donation</td><td>30</td></tr>
    <tr><td>Revenue Growth Rate</td><td>10%</td></tr>
  </table>

  <button class="export-btn" (click)="exportToExcel()">Export to Excel</button>
</div>
