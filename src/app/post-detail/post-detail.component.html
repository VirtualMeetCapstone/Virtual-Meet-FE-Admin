<section class="content" style="background-color: #eee;">
  <div class="container py-5">
    <div class="row">
      <div class="col">
        <nav aria-label="breadcrumb" class="bg-body-tertiary rounded-3 p-3 mb-4">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a routerLink="/post-manager" routerLinkActive="active">Post Management</a></li>

            <li class="breadcrumb-item active" aria-current="page">Post Detail</li>
          </ol>
        </nav>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-4">
        <div class="card mb-4">
          <div class="card-body text-center">
            <img [src]="post?.user?.picture?.url" alt="avatar"
                 class="rounded-circle img-fluid" style="width: 150px;">
            <h5 class="my-3"><p class="text-muted mb-0">
              {{ post?.user?.name }}
            </p></h5>
            <p class="text-muted mb-1">Full Stack Developer</p>
            <p class="text-muted mb-4">Bay Area, San Francisco, CA</p>
            <div class="d-flex justify-content-center mb-2">
              <button type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-outline-primary ms-1">
                Message
              </button>

            </div>
          </div>
        </div>

      </div>
      <div class="col-lg-8">
        <div class="card mb-4">
          <div class="card-body">
            <div class="row">
              <div class="col-sm-3">
                <p class="mb-0">Author</p>
              </div>
              <div class="col-sm-9">
                <p class="text-muted mb-0">
                  {{ post?.user?.name }}
                </p>

              </div>
            </div>
            <hr>
            <div class="row">
              <div class="col-sm-3">
                <p class="mb-0">Content</p>
              </div>
              <div class="col-sm-9">
                <p class="text-muted mb-0">{{ post?.content }}</p>
              </div>
            </div>
            <hr>
            <div class="row">
              <div class="col-sm-3">
                <p class="mb-0">Created At</p>
              </div>
              <div class="col-sm-9">
                <p class="text-muted mb-0">{{ post?.formattedCreateTime }}</p>
              </div>
            </div>
            <hr>
            <div class="row">
              <div class="col-sm-3">
                <p class="mb-0">Reaction Count</p>
              </div>
              <div class="col-sm-9">
                <p class="text-muted mb-0">{{ post?.countReaction }}</p>
              </div>
            </div>
            <hr>
            <!-- <div class="row">
              <div class="col-sm-3">
                <p class="mb-0">Media</p>
              </div>
              <div class="col-sm-9" *ngIf="post?.medias && post?.medias?.length">
                <div *ngFor="let media of post?.medias">
                  <img [src]="media.url" [alt]="media.type === 1 ? 'Image' : 'Other Media Type'" class="media-image">
                </div>

              </div>
            </div> -->
            <div class="col-md-12" style="height: 250px">
              <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
                <div *ngIf="post?.medias && post?.medias?.length">
                  <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">
                      <div *ngFor="let media of post?.medias; let i = index" class="carousel-item"
                           [class.active]="i === 0">
                        <img [src]="media.url" [alt]="media.type === 1 ? 'Image' : 'Other Media Type'"
                             style="height: 250px; object-fit: contain;" class="media-image d-block w-100">
                      </div>
                    </div>

                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
                            data-bs-slide="prev">
                      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                      <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
                            data-bs-slide="next">
                      <span class="carousel-control-next-icon" aria-hidden="true"></span>
                      <span class="visually-hidden">Next</span>
                    </button>
                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
