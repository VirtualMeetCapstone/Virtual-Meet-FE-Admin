<div class="container" style="margin-top: 70px; margin-bottom: 20px">
  <div class="row g-4" *ngIf="reportsData.length > 0">
    <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let report of reportsData">
      <div class="card h-100" style="border-radius: 10px; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5)">
        <div class="target-report" style="display: flex; justify-content: center; margin-top: 20px">
          <img style="border-radius: 50%; width: 40px; height: 40px; margin-right: 10px"
               [src]="report.targetReporter.picture.url || 'https://via.placeholder.com/40'"
               alt="Avatar">
          <h5 class="card-title" style="margin-top: 10px;">{{ report.targetReporter.name }}</h5>
          <i style="color: red; margin-top: 12px; margin-left: 10px" class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <div class="card-body d-flex flex-column">
          <p style="font-weight: bold;">Reporter:</p>
          <p>{{ report.reporter.name }}</p>
          <p class="card-text" style="font-weight: bold;">Reason:</p>
          <p class="card-text flex-grow-1">{{ report.reason }}</p>

          <button class="btn btn-danger mt-auto" (click)="delete1(report.reporterId,report.targetId)">Ban</button>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="reportsData.length == 0">
    <p style="color: grey; text-align: center">Empty list!</p>
  </div>
</div>
<div class="modal fade" id="deleteModal" data-bs-backdrop="false" tabindex="-1" aria-labelledby="deleteModalLabel"
     aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteModalLabel">Confirm Deletion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete this item {{ selectedUserId }}?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="confirmDelete()">Confirm</button>
      </div>
    </div>
  </div>
</div>
