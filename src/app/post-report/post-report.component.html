<div class="report-container">
  <h1>📌 Post Report</h1>
  <div class="filter">
    <p>
      <strong>From Date:</strong>&nbsp;
      <input
        type="date"
        [(ngModel)]="beforeDate"
        (ngModelChange)="onDateChange()"
        [max]="afterDate"
        name="from-date"
      >
    </p>

    <p>
      <strong>To Date:</strong>&nbsp;
      <input
        type="date"
        [(ngModel)]="afterDate"
        (ngModelChange)="onDateChange()"
        [min]="beforeDate"
        [max]="today"
        name="to-date"
      >
    </p>
  </div>

  <table id="post-report">
    <tr><th>Category</th><th>Value</th></tr>
    <tr><td>Total Posts</td><td>{{postReportData?.totalPosts}}</td></tr>
    <tr><td>New Posts {{beforeDate}} - {{afterDate}}</td><td>{{postReportData?.newPosts}}</td></tr>
    <tr><td>Reported Posts</td><td>{{postReportData?.deletedPosts}}</td></tr>
    <tr><td>Post Growth Rate</td><td>{{ (postReportData?.growthRate) | percent:'1.0-2' }}</td></tr>

  </table>

  <button class="export-btn" (click)="postReportToExcel()">Export to Excel</button>
</div>
